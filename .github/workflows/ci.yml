name: CI
on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1' # automatically expands to the latest stable 1.x release of Julia
          - 'min'
          - 'pre'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: 1
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  parsers-compat:
    name: Parsers ${{ matrix.parsers-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parsers-version:
          - '2'
          - '3'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Test selected Parsers major
        shell: julia --color=yes --startup-file=no {0}
        env:
          PARSERS_VERSION: ${{ matrix.parsers-version }}
        run: |
          using Pkg
          Pkg.activate(mktempdir())
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.add(PackageSpec(name="Parsers", version=ENV["PARSERS_VERSION"]))
          Pkg.test("InlineStrings")
